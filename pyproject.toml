[project]
name = "gemsmarl"
version = "0.1.0"
description = "My Reinforcement Learning Algorithm Library"
readme = "README.md"
requires-python = "==3.11.*"
authors = [
    {name = "Gems Xu", email = "xwz@seu.edu.cn"}
]
dependencies = [
    "av<14",
    "hydra-core",
    "matplotlib>=3.10.8",
    "moviepy>=2.2.1",
    "numpy",
    "torchrl>=0.8.1,<0.11",
    "torchvision",
    "tqdm",
    "vmas>=1.5.1",
    "wandb>=0.22.3",
]

[project.optional-dependencies]
vmas = ["vmas>=1.3.4"]
pettingzoo = ["pettingzoo[all]>=1.24.3"]
meltingpot = ["dm-meltingpot"]
gnn = ["torch_geometric"]
logging = ["moviepy", "wandb"]
visualization = ["matplotlib>=3.5.0"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gemsmarl*"]

[tool.setuptools.package-data]
gemsmarl = ["conf/**/*"]
